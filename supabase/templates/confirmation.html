<!-- Sign-up code. Supabase -> Authentication -> Emails -> Templates -> Confirm signup -->
<div style="font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #1A1D1E;">
  <p style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: #5E7A0E; margin: 0 0 24px;">JOGA</p>
  <h1 style="font-size: 24px; margin: 0 0 12px;">Your code</h1>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 24px;">Enter this code in the Joga app to finish creating your account.</p>
  <p style="font-size: 36px; font-weight: 800; letter-spacing: 0.3em; margin: 0 0 24px; padding: 16px; background: #F2F6E6; border-radius: 12px; text-align: center;">{{ .Token }}</p>
  <p style="font-size: 14px; line-height: 1.5; color: #5B6266; margin: 0;">The code lasts an hour. If you didn't sign up for Joga, you can ignore this email.</p>
</div>
